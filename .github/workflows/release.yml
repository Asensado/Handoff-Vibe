name: Build and publish Handoff release

on:
  push:
    branches: [main]
    paths: [RELEASE.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: handoff-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container: debian:13
    timeout-minutes: 25
    steps:
      - name: Install Debian build and preview dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git gh build-essential cmake dpkg-dev qt6-base-dev qt6-connectivity-dev \
            meson ninja-build pkg-config libglib2.0-dev libbluetooth-dev gettext \
            libavcodec-dev libpipewire-0.3-dev python3 python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 \
            nodejs gjs dbus-x11 xvfb xauth imagemagick fonts-dejavu-core adwaita-icon-theme \
            gsettings-desktop-schemas libgl1-mesa-dri util-linux librsvg2-common
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare an unprivileged test user
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build and test
        run: |
          runuser -u builder -- bash -c 'cd "$1" && python3 packaging/build-deb.py && bash VERIFY-LOCAL.sh' _ "$GITHUB_WORKSPACE"
      - name: Render installation screenshots using demo data
        run: |
          runuser -u builder -- env GDK_BACKEND=x11 GSETTINGS_BACKEND=memory GTK_A11Y=none \
            HANDOFF_SCREENSHOTS="$GITHUB_WORKSPACE/docs/images" \
            dbus-run-session -- xvfb-run -a python3 tests/ui_smoke.py
          test -s docs/images/setup-welcome.png
          test -s docs/images/setup-headsets.png
          test -s docs/images/setup-confirm.png
          test -s docs/images/device-dark.png
      - name: Package documentation and publish configured release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runuser -u builder -- python3 packaging/build-deb.py
          python3 packaging/release.py --publish
