name: Reliability checks

on:
  push:
    branches: [main, 'fix/**']
  pull_request:

permissions:
  contents: read

jobs:
  debian:
    runs-on: ubuntu-latest
    container: debian:13
    timeout-minutes: 20
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git build-essential cmake dpkg-dev qt6-base-dev qt6-connectivity-dev \
            meson ninja-build pkg-config libglib2.0-dev libbluetooth-dev gettext \
            libavcodec-dev libpipewire-0.3-dev python3 python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 \
            nodejs dbus-daemon dbus-x11 xvfb xauth librsvg2-common gir1.2-gdkpixbuf-2.0 \
            gsettings-desktop-schemas fonts-dejavu-core adwaita-icon-theme libgl1-mesa-dri
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare an unprivileged test user
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Build package and run checks
        run: |
          runuser -u builder -- bash -c 'cd "$1" && python3 packaging/build-deb.py && bash VERIFY-LOCAL.sh' _ "$GITHUB_WORKSPACE"
      - name: Exercise native UI and lifecycle regressions
        run: |
          runuser -u builder -- env HANDOFF_SKIP_SCREENSHOTS=1 GDK_BACKEND=x11 \
            GSETTINGS_BACKEND=memory GTK_A11Y=none \
            dbus-run-session -- xvfb-run -a python3 "$GITHUB_WORKSPACE/tests/ui_smoke.py"
